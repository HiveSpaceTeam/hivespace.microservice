syntax = "proto3";

option csharp_namespace = "HiveSpace.Infrastructure.Messaging.Shared.Grpc.SellerProvisioning";

package hivespace.sellerprovisioning;

service IdentitySellerProvisioning {
  rpc ProvisionSellerIdentity (ProvisionSellerIdentityRequest) returns (ProvisionSellerIdentityResponse);
}

service IdentityImportedSellerProvisioning {
  rpc ProvisionImportedSellerAccount (ProvisionImportedSellerAccountRequest) returns (ProvisionImportedSellerAccountResponse);
}

service UserImportedSellerProvisioning {
  rpc ProvisionImportedSellerStore (ProvisionImportedSellerStoreRequest) returns (ProvisionImportedSellerStoreResponse);
}

enum ProvisioningOutcome {
  PROVISIONING_OUTCOME_UNSPECIFIED = 0;
  CREATED = 1;
  MATCHED = 2;
  CONFLICT = 3;
  FAILED = 4;
}

message ProvisionSellerIdentityRequest {
  string correlation_id = 1;
  string user_id = 2;
  string store_id = 3;
  string store_name = 4;
}

message ProvisionSellerIdentityResponse {
  ProvisioningOutcome outcome = 1;
  string identity_user_id = 2;
  string store_id = 3;
  string failure_code = 4;
  string failure_message = 5;
}

message ProvisionImportedSellerAccountRequest {
  string correlation_id = 1;
  string bundle_id = 2;
  string imported_seller_id = 3;
  string external_source = 4;
  string external_seller_id = 5;
  string seller_name = 6;
  string email = 7;
}

message ProvisionImportedSellerAccountResponse {
  ProvisioningOutcome outcome = 1;
  string identity_user_id = 2;
  string failure_code = 3;
  string failure_message = 4;
}

message ProvisionImportedSellerStoreRequest {
  string correlation_id = 1;
  string bundle_id = 2;
  string imported_seller_id = 3;
  string identity_user_id = 4;
  string external_source = 5;
  string external_seller_id = 6;
  string store_name = 7;
}

message ProvisionImportedSellerStoreResponse {
  ProvisioningOutcome outcome = 1;
  string store_id = 2;
  string failure_code = 3;
  string failure_message = 4;
}
